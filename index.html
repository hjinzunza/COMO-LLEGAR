
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1a27">
<title>CÓMO LLEGAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1a27;color:#fff;font-family:Arial,sans-serif}
main{max-width:720px;margin:35px auto;padding:24px;background:#172b3c;border-radius:18px}
h1{text-align:center;color:#35d9ef;font-size:29px}
label{display:block;margin:18px 0 7px;font-weight:bold}
.buscador{position:relative}
input{width:100%;padding:15px;border:1px solid #7e9aaa;border-radius:9px;font-size:17px;color:#172b3c}
button{cursor:pointer;border:0;border-radius:9px;padding:14px;font-size:16px;font-weight:bold}
nav{display:flex;gap:10px;margin:15px 0}
nav button{flex:1;background:#36556c;color:white}
.primary{background:#17c5df;color:#06202a;width:100%;margin-top:12px}
#reloj{display:none;text-align:center;font-size:32px;margin:20px 0;color:#35d9ef;font-weight:bold}
#estado{color:#b8d6e3;font-size:14px;min-height:20px;margin-top:10px}
.sugerencias{display:none;position:absolute;top:100%;left:0;right:0;background:white;color:#172b3c;border-radius:9px;max-height:270px;overflow-y:auto;z-index:100;box-shadow:0 5px 15px #0006}
.sugerencia{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid #ddd;border-radius:0;background:white;color:#172b3c;text-align:left;font-size:15px;font-weight:normal}
.sugerencia:hover,.sugerencia:focus{background:#dff8fc}
@media(max-width:600px){main{margin:12px;padding:18px}h1{font-size:25px}}
</style>
</head>
<body>
<main>
<h1>🚌 CÓMO LLEGAR 🚆</h1>

<label for="origen">ORIGEN</label>
<div class="buscador">
<input id="origen" placeholder="Escribe calle, dirección o lugar" autocomplete="off">
<div id="sugerenciasOrigen" class="sugerencias"></div>
</div>

<label for="destino">DESTINO</label>
<div class="buscador">
<input id="destino" placeholder="Escribe tu destino" autocomplete="off">
<div id="sugerenciasDestino" class="sugerencias"></div>
</div>

<div id="estado" role="status"></div>

<nav>
<button id="invertir" type="button">⇄ INVERTIR</button>
<button id="limpiar" type="button">✕ LIMPIAR</button>
</nav>

<button class="primary" id="planificar" type="button">🗺️ PLANIFICAR VIAJE</button>
<div id="reloj"></div>
</main>

<script>
const origen = document.getElementById('origen');
const destino = document.getElementById('destino');
const reloj = document.getElementById('reloj');
const estado = document.getElementById('estado');

function hora(){
  reloj.textContent = new Intl.DateTimeFormat('es-CL',{
    timeZone:'America/Santiago',
    hour:'2-digit',minute:'2-digit',second:'2-digit',
    hour12:false
  }).format(new Date());
}
setInterval(hora,1000);
hora();

const lugares = [
['Plaza Vergara','Viña del Mar'],
['Reloj de Flores','Viña del Mar'],
['Quinta Vergara','Viña del Mar'],
['Terminal de Buses de Viña del Mar','Viña del Mar'],
['Hospital Gustavo Fricke','Viña del Mar'],
['Mall Marina','Viña del Mar'],
['Avenida Libertad','Viña del Mar'],
['Avenida Perú','Viña del Mar'],
['Reñaca','Viña del Mar'],
['Estación Viña del Mar','Viña del Mar'],
['Estación Puerto','Valparaíso'],
['Plaza Sotomayor','Valparaíso'],
['Plaza Victoria','Valparaíso'],
['Terminal Rodoviario','Valparaíso'],
['Cerro Alegre','Valparaíso'],
['Estación Quilpué','Quilpué'],
['Estación Villa Alemana','Villa Alemana'],
['Estación Limache','Limache'],
['Plaza de Quillota','Quillota'],
['Algarrobo','Algarrobo'],
['La Calera','La Calera'],
['La Ligua','La Ligua'],
['Quintero','Quintero'],
['Santiago','Santiago'],
['Plaza de Armas','Santiago'],
['Estación Central','Santiago'],
['Terminal Alameda','Santiago'],
['Aeropuerto Arturo Merino Benítez','Santiago'],
['Providencia','Santiago'],
['Puente Alto','Santiago'],
['Maipú','Santiago'],
['Valparaíso','Valparaíso'],
['Viña del Mar','Viña del Mar'],
['Rancagua','Región de O’Higgins'],
['Talca','Región del Maule'],
['Chillán','Región de Ñuble'],
['Concepción','Región del Biobío'],
['Temuco','Región de La Araucanía'],
['Valdivia','Región de Los Ríos'],
['Osorno','Región de Los Lagos'],
['Puerto Montt','Región de Los Lagos'],
['Coyhaique','Región de Aysén'],
['Punta Arenas','Región de Magallanes'],
['La Serena','Región de Coquimbo'],
['Coquimbo','Región de Coquimbo'],
['Copiapó','Región de Atacama'],
['Antofagasta','Región de Antofagasta'],
['Calama','Región de Antofagasta'],
['Iquique','Región de Tarapacá'],
['Arica','Región de Arica y Parinacota']
].map(([nombre,comuna]) => `${nombre}, ${comuna}, Chile`);

const normalizar = s => s.normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'').toLowerCase();

const cache = new Map();
const estados = new Map();

function sugerir(input,lista){
  const st = {timer:null,controller:null,version:0};
  estados.set(input,st);

  function mostrar(resultados){
    lista.replaceChildren();
    const vistos = new Set();

    resultados.forEach(d => {
      const k = normalizar(d);
      if(vistos.has(k)) return;
      vistos.add(k);

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sugerencia';
      b.textContent = d;

      b.onclick = () => {
        input.value = d;
        lista.style.display = 'none';
        lista.replaceChildren();
        estado.textContent = '';
        st.version++;
        clearTimeout(st.timer);
        st.controller?.abort();
      };

      lista.appendChild(b);
    });

    lista.style.display = lista.children.length ? 'block' : 'none';
  }

  input.addEventListener('input',() => {
    const q = input.value.trim();
    st.version++;
    const version = st.version;

    clearTimeout(st.timer);
    st.controller?.abort();

    if(q.length < 2){
      lista.style.display = 'none';
      lista.replaceChildren();
      estado.textContent = '';
      return;
    }

    const local = lugares
      .filter(x => normalizar(x).includes(normalizar(q)))
      .slice(0,8);

    const key = normalizar(q);
    mostrar([...local,...(cache.get(key)||[])]);

    if(q.length < 3) return;

    estado.textContent = 'Buscando direcciones en Chile…';

    st.timer = setTimeout(async() => {
      const ctrl = new AbortController();
      st.controller = ctrl;

      try{
        let remotos = [];

        try{
          const url = 'https://photon.komoot.io/api/?q=' +
            encodeURIComponent(q + ' Chile') + '&limit=20';

          const r = await fetch(url,{signal:ctrl.signal});
          if(!r.ok) throw Error('Error de búsqueda');

          const data = await r.json();

          remotos = (data.features||[]).map(f => {
            const p = f.properties||{};
            return [
              p.name,
              p.housenumber,
              p.street,
              p.city||p.county||p.district,
              p.state,
              'Chile'
            ].filter(Boolean).join(', ');
          }).filter(Boolean);

        }catch(err){
          if(err.name === 'AbortError') throw err;

          const url2 =
            'https://nominatim.openstreetmap.org/search?format=jsonv2' +
            '&addressdetails=1&countrycodes=cl&limit=15&q=' +
            encodeURIComponent(q);

          const r2 = await fetch(url2,{signal:ctrl.signal});
          if(!r2.ok) throw Error('Error de búsqueda alternativa');

          const data2 = await r2.json();

          remotos = data2.map(f => {
            const a = f.address||{};
            const ciudad = a.city||a.town||a.village||
              a.municipality||a.county||'';
            const region = a.state||'';

            return [
              f.name || (f.display_name||'').split(',')[0],
              a.house_number,
              a.road,
              ciudad,
              region,
              'Chile'
            ].filter(Boolean).join(', ');
          });
        }

        if(version !== st.version) return;

        cache.set(key,remotos);
        if(cache.size > 80) cache.delete(cache.keys().next().value);

        mostrar([...local,...remotos]);
        estado.textContent = remotos.length
          ? 'Selecciona una dirección de la lista.'
          : 'No encontramos coincidencias. Prueba con otra búsqueda.';

      }catch(e){
        if(e.name !== 'AbortError' && version === st.version){
          estado.textContent = 'No se pudo buscar. Revisa tu conexión o escribe la dirección completa.';
        }
      }
    },300);
  });
}

const so = document.getElementById('sugerenciasOrigen');
const sd = document.getElementById('sugerenciasDestino');

sugerir(origen,so);
sugerir(destino,sd);

document.addEventListener('click',e => {
  if(!e.target.closest('.buscador')){
    so.style.display = 'none';
    sd.style.display = 'none';
  }
});

document.getElementById('invertir').onclick = () => {
  [origen.value,destino.value] = [destino.value,origen.value];
  so.style.display = sd.style.display = 'none';
};

document.getElementById('limpiar').onclick = () => {
  origen.value = '';
  destino.value = '';
  reloj.style.display = 'none';
  so.style.display = sd.style.display = 'none';
  estado.textContent = '';

  for(const st of estados.values()){
    st.version++;
    clearTimeout(st.timer);
    st.controller?.abort();
  }
};

document.getElementById('planificar').onclick = () => {
  const o = origen.value.trim();
  const d = destino.value.trim();

  if(!o || !d){
    alert('Escribe el origen y el destino.');
    return;
  }

  reloj.style.display = 'block';
  hora();

  const url = 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + encodeURIComponent(o) +
    '&destination=' + encodeURIComponent(d) +
    '&travelmode=transit';

  window.open(url,'_blank','noopener,noreferrer');
};
</script>
</body>
</html>
