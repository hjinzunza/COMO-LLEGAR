<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYA TRANSPORTE</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0e1a27;
    color: white;
    font-family: Arial, sans-serif;
}

main {
    max-width: 720px;
    margin: 35px auto;
    padding: 24px;
    background: #172b3c;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #35d9ef;
    font-size: 29px;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #7e9aaa;
    border-radius: 9px;
    font-size: 17px;
}

button {
    cursor: pointer;
    border: 0;
    border-radius: 9px;
    padding: 14px;
    font-weight: bold;
    font-size: 16px;
}

nav {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

nav button {
    flex: 1;
    background: #36556c;
    color: white;
}

.primary {
    background: #17c5df;
    color: #06202a;
    width: 100%;
    margin-top: 12px;
}

#gps {
    background: #36556c;
    color: white;
    margin-bottom: 9px;
    width: 100%;
}

#reloj {
    display: none;
    text-align: center;
    font-size: 29px;
    margin: 18px 0;
}

#mapa {
    display: none;
    margin-top: 18px;
    width: 100%;
    height: 360px;
    border: 0;
    border-radius: 12px;
}

#estado {
    color: #b8d6e3;
    font-size: 13px;
    min-height: 18px;
    margin-top: 8px;
}
</style>
</head>

<body>

<main>

<h1>🚌🚆 PLAYA TRANSPORTE</h1>

<label for="origen">ORIGEN</label>

<button id="gps" type="button">
📍 MI UBICACIÓN
</button>

<input
    id="origen"
    placeholder="Escribe tu dirección"
    autocomplete="street-address"
>

<label for="destino">DESTINO</label>

<input
    id="destino"
    placeholder="Escribe tu destino"
>

<div id="estado" role="status"></div>

<nav>
    <button id="invertir" type="button">
        ⇄ INVERTIR
    </button>

    <button id="limpiar" type="button">
        ✕ LIMPIAR
    </button>
</nav>

<button class="primary" id="planificar" type="button">
🗺️ PLANIFICAR VIAJE
</button>

<div id="reloj"></div>

<iframe
    id="mapa"
    title="Mapa del destino"
    loading="lazy">
</iframe>

</main>

<script>

const origen = document.getElementById("origen");
const destino = document.getElementById("destino");
const reloj = document.getElementById("reloj");
const mapa = document.getElementById("mapa");
const estado = document.getElementById("estado");
const gps = document.getElementById("gps");

// RELOJ DE CHILE

function hora() {
    reloj.textContent = new Intl.DateTimeFormat("es-CL", {
        timeZone: "America/Santiago",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(new Date());
}

setInterval(hora, 1000);
hora();

// GPS CON DIRECCIÓN EN TEXTO

gps.onclick = () => {

    if (!navigator.geolocation) {
        estado.textContent = "GPS no disponible.";
        return;
    }

    gps.disabled = true;
    estado.textContent = "Buscando tu dirección...";

    navigator.geolocation.getCurrentPosition(

        async posicion => {

            try {

                const lat = posicion.coords.latitude;
                const lon = posicion.coords.longitude;

                const url =
                    "https://nominatim.openstreetmap.org/reverse" +
                    "?format=jsonv2" +
                    "&addressdetails=1" +
                    "&zoom=18" +
                    "&lat=" + encodeURIComponent(lat) +
                    "&lon=" + encodeURIComponent(lon);

                const respuesta = await fetch(url, {
                    headers: {
                        "Accept": "application/json",
                        "Accept-Language": "es"
                    }
                });

                if (!respuesta.ok) {
                    throw new Error("Servicio no disponible");
                }

                const datos = await respuesta.json();
                const a = datos.address || {};

                const calle =
                    a.road ||
                    a.pedestrian ||
                    a.neighbourhood ||
                    a.suburb ||
                    "";

                const numero = a.house_number || "";

                const comuna =
                    a.city ||
                    a.town ||
                    a.village ||
                    a.municipality ||
                    a.county ||
                    "";

                const region = a.state || "";

                if (!calle && !comuna) {
                    throw new Error("Dirección no encontrada");
                }

                const direccion = [
                    [calle, numero].filter(Boolean).join(" "),
                    comuna,
                    region,
                    "Chile"
                ].filter(Boolean).join(", ");

                // SOLO SE MUESTRA TEXTO
                origen.value = direccion;

                estado.textContent =
                    "Ubicación aproximada. Puedes corregir la dirección.";

            } catch (error) {

                estado.textContent =
                    "No se encontró la dirección. Escríbela manualmente.";

            } finally {
                gps.disabled = false;
            }

        },

        error => {

            gps.disabled = false;

            estado.textContent =
                "No se pudo acceder al GPS. Escribe tu origen.";

        },

        {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 30000
        }

    );

};

// INVERTIR DIRECCIONES

document.getElementById("invertir").onclick = () => {

    const temporal = origen.value;

    origen.value = destino.value;
    destino.value = temporal;

};

// LIMPIAR

document.getElementById("limpiar").onclick = () => {

    origen.value = "";
    destino.value = "";

    reloj.style.display = "none";
    mapa.style.display = "none";

    mapa.removeAttribute("src");

    estado.textContent = "";

};

// PLANIFICAR VIAJE

document.getElementById("planificar").onclick = () => {

    const o = origen.value.trim();
    const d = destino.value.trim();

    if (!o || !d) {
        alert("Escribe el origen y el destino.");
        return;
    }

    // MOSTRAR RELOJ
    reloj.style.display = "block";
    hora();

    // MOSTRAR MAPA DEL DESTINO
    mapa.src =
        "https://maps.google.com/maps?q=" +
        encodeURIComponent(d) +
        "&output=embed";

    mapa.style.display = "block";

    // GOOGLE MAPS EN TRANSPORTE PÚBLICO
    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&origin=" + encodeURIComponent(o) +
        "&destination=" + encodeURIComponent(d) +
        "&travelmode=transit";

    window.open(url, "_blank", "noopener,noreferrer");

};

</script>

</body>
</html>
