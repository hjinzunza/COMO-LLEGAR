<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a27">
<title>PLAYA TRANSPORTE V15</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0e1a27;
    color: white;
    font-family: Arial, sans-serif;
}

main {
    max-width: 720px;
    margin: 35px auto;
    padding: 24px;
    background: #172b3c;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #35d9ef;
    font-size: 29px;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

.buscador {
    position: relative;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #7e9aaa;
    border-radius: 9px;
    font-size: 17px;
    background: white;
    color: #172b3c;
}

.sugerencias {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    color: #172b3c;
    border-radius: 9px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 5px 15px #0006;
}

.sugerencia {
    display: block;
    width: 100%;
    padding: 13px;
    border: 0;
    border-bottom: 1px solid #ddd;
    background: white;
    color: #172b3c;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.sugerencia:hover,
.sugerencia:focus {
    background: #dff8fc;
}

button {
    cursor: pointer;
    border: 0;
    border-radius: 9px;
    padding: 14px;
    font-weight: bold;
    font-size: 16px;
}

nav {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

nav button {
    flex: 1;
    background: #36556c;
    color: white;
}

.primary {
    background: #17c5df;
    color: #06202a;
    width: 100%;
    margin-top: 12px;
}

#reloj {
    display: none;
    text-align: center;
    font-size: 32px;
    margin: 20px 0;
    color: #35d9ef;
    font-weight: bold;
}

#estado {
    color: #b8d6e3;
    font-size: 14px;
    min-height: 20px;
    margin-top: 10px;
}

@media(max-width: 600px) {
    main {
        margin: 12px;
        padding: 18px;
    }

    h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<main>

<h1>🚌🚆 PLAYA TRANSPORTE</h1>

<label for="origen">ORIGEN</label>

<div class="buscador">
    <input
        id="origen"
        placeholder="Escribe calle, dirección o lugar"
        autocomplete="off"
    >
    <div id="sugerenciasOrigen" class="sugerencias"></div>
</div>

<label for="destino">DESTINO</label>

<div class="buscador">
    <input
        id="destino"
        placeholder="Escribe tu destino"
        autocomplete="off"
    >
    <div id="sugerenciasDestino" class="sugerencias"></div>
</div>

<div id="estado" role="status"></div>

<nav>
    <button id="invertir" type="button">
        ⇄ INVERTIR
    </button>

    <button id="limpiar" type="button">
        ✕ LIMPIAR
    </button>
</nav>

<button class="primary" id="planificar" type="button">
    🗺️ PLANIFICAR VIAJE
</button>

<div id="reloj"></div>

</main>

<script>

// ELEMENTOS

const origen = document.getElementById("origen");
const destino = document.getElementById("destino");
const reloj = document.getElementById("reloj");
const estado = document.getElementById("estado");

const sugerenciasOrigen =
    document.getElementById("sugerenciasOrigen");

const sugerenciasDestino =
    document.getElementById("sugerenciasDestino");


// RELOJ DE CHILE

function hora() {

    reloj.textContent = new Intl.DateTimeFormat("es-CL", {
        timeZone: "America/Santiago",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(new Date());

}

setInterval(hora, 1000);
hora();


// LUGARES LOCALES DE LA QUINTA REGIÓN

const lugaresLocales = [

    "Plaza Vergara, Viña del Mar, Chile",
    "Avenida Libertad, Viña del Mar, Chile",
    "Avenida Perú, Viña del Mar, Chile",
    "Playa Acapulco, Viña del Mar, Chile",
    "Playa Caleta Abarca, Viña del Mar, Chile",
    "Reloj de Flores, Viña del Mar, Chile",
    "Quinta Vergara, Viña del Mar, Chile",
    "Hospital Gustavo Fricke, Viña del Mar, Chile",
    "Terminal de Buses de Viña del Mar, Chile",
    "Estación Viña del Mar, Chile",
    "Estación Miramar, Viña del Mar, Chile",
    "Estación Recreo, Viña del Mar, Chile",
    "Estación Chorrillos, Viña del Mar, Chile",
    "Estación El Salto, Viña del Mar, Chile",
    "Recreo, Viña del Mar, Chile",
    "Miraflores, Viña del Mar, Chile",
    "Achupallas, Viña del Mar, Chile",
    "Reñaca, Viña del Mar, Chile",
    "Concón, Región de Valparaíso, Chile",

    "Plaza Sotomayor, Valparaíso, Chile",
    "Plaza Victoria, Valparaíso, Chile",
    "Plaza Aníbal Pinto, Valparaíso, Chile",
    "Estación Puerto, Valparaíso, Chile",
    "Estación Bellavista, Valparaíso, Chile",
    "Estación Francia, Valparaíso, Chile",
    "Estación Barón, Valparaíso, Chile",
    "Terminal Rodoviario, Valparaíso, Chile",
    "Avenida Argentina, Valparaíso, Chile",
    "Cerro Alegre, Valparaíso, Chile",
    "Cerro Concepción, Valparaíso, Chile",
    "Playa Ancha, Valparaíso, Chile",
    "Placilla, Valparaíso, Chile",

    "Plaza de Quilpué, Quilpué, Chile",
    "Estación Quilpué, Chile",
    "Estación El Sol, Quilpué, Chile",
    "Estación El Belloto, Quilpué, Chile",
    "El Belloto, Quilpué, Chile",

    "Plaza de Villa Alemana, Chile",
    "Estación Villa Alemana, Chile",
    "Estación La Concepción, Villa Alemana, Chile",
    "Estación Peñablanca, Villa Alemana, Chile",

    "Plaza de Limache, Chile",
    "Estación Limache, Chile",
    "Terminal de Buses de Limache, Chile",

    "Plaza de Quillota, Chile",
    "Terminal de Buses de Quillota, Chile",

    "Plaza de San Antonio, Chile",
    "Terminal de Buses de San Antonio, Chile"

];


// NORMALIZAR TEXTO

function normalizar(texto) {

    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

}


// CACHÉ DE BÚSQUEDAS

const cache = new Map();

const temporizadores = new Map();

const controladores = new Map();


// MOSTRAR SUGERENCIAS

function mostrarSugerencias(input, lista, resultados) {

    lista.replaceChildren();

    const unicos = [...new Set(resultados)];

    unicos.slice(0, 12).forEach(direccion => {

        const boton = document.createElement("button");

        boton.type = "button";
        boton.className = "sugerencia";
        boton.textContent = direccion;

        boton.onclick = () => {

            input.value = direccion;

            lista.style.display = "none";
            lista.replaceChildren();

            estado.textContent = "";

        };

        lista.appendChild(boton);

    });

    lista.style.display =
        unicos.length > 0 ? "block" : "none";

}


// BUSCADOR INTELIGENTE

function configurarBuscador(input, lista) {

    let numeroBusqueda = 0;

    input.addEventListener("input", () => {

        numeroBusqueda++;

        const busquedaActual = numeroBusqueda;

        clearTimeout(temporizadores.get(input));

        const anterior = controladores.get(input);

        if (anterior) anterior.abort();

        const texto = input.value.trim();

        lista.style.display = "none";
        lista.replaceChildren();

        if (texto.length < 2) return;

        const consulta = normalizar(texto);

        // SUGERENCIAS LOCALES INSTANTÁNEAS

        const locales = lugaresLocales.filter(lugar => {

            return normalizar(lugar).includes(consulta);

        });

        mostrarSugerencias(input, lista, locales);

        // RESULTADOS GUARDADOS EN CACHÉ

        if (cache.has(consulta)) {

            mostrarSugerencias(
                input,
                lista,
                [...locales, ...cache.get(consulta)]
            );

            return;

        }

        // CONSULTA EXTERNA

        if (texto.length < 3) return;

        const temporizador = setTimeout(async () => {

            const controlador = new AbortController();

            controladores.set(input, controlador);

            try {

                const url =
                    "https://photon.komoot.io/api/" +
                    "?q=" + encodeURIComponent(texto) +
                    "&lat=-33.0245" +
                    "&lon=-71.5518" +
                    "&limit=15";

                const respuesta = await fetch(url, {
                    signal: controlador.signal
                });

                if (!respuesta.ok) {
                    throw new Error("Servicio no disponible");
                }

                const datos = await respuesta.json();

                if (numeroBusqueda !== busquedaActual) return;

                const encontrados = [];

                (datos.features || []).forEach(lugar => {

                    const p = lugar.properties || {};

                    const informacion = [
                        p.state,
                        p.county,
                        p.city,
                        p.district
                    ].filter(Boolean).join(" ").toLowerCase();

                    const regionValida = [
                        "valparaíso",
                        "valparaiso",
                        "viña del mar",
                        "quilpué",
                        "quilpue",
                        "villa alemana",
                        "limache",
                        "concón",
                        "concon",
                        "quillota",
                        "san antonio"
                    ].some(nombre => informacion.includes(nombre));

                    if (!regionValida) return;

                    const direccion = [
                        p.name,
                        p.housenumber,
                        p.street,
                        p.city || p.county,
                        p.state,
                        "Chile"
                    ].filter(Boolean).join(", ");

                    encontrados.push(direccion);

                });

                cache.set(consulta, encontrados);

                mostrarSugerencias(
                    input,
                    lista,
                    [...locales, ...encontrados]
                );

            } catch (error) {

                if (error.name !== "AbortError") {

                    // CONSERVAR SUGERENCIAS LOCALES

                    if (numeroBusqueda === busquedaActual) {

                        mostrarSugerencias(
                            input,
                            lista,
                            locales
                        );

                    }

                }

            }

        }, 200);

        temporizadores.set(input, temporizador);

    });

}


// ACTIVAR BUSCADORES

configurarBuscador(origen, sugerenciasOrigen);

configurarBuscador(destino, sugerenciasDestino);


// CERRAR LISTAS

document.addEventListener("click", evento => {

    if (!evento.target.closest(".buscador")) {

        sugerenciasOrigen.style.display = "none";

        sugerenciasDestino.style.display = "none";

    }

});


// INVERTIR DIRECCIONES

document.getElementById("invertir").onclick = () => {

    const temporal = origen.value;

    origen.value = destino.value;

    destino.value = temporal;

    sugerenciasOrigen.style.display = "none";

    sugerenciasDestino.style.display = "none";

};


// LIMPIAR

document.getElementById("limpiar").onclick = () => {

    origen.value = "";

    destino.value = "";

    reloj.style.display = "none";

    sugerenciasOrigen.style.display = "none";

    sugerenciasDestino.style.display = "none";

    estado.textContent = "";

};


// PLANIFICAR VIAJE

document.getElementById("planificar").onclick = () => {

    const o = origen.value.trim();

    const d = destino.value.trim();

    if (!o || !d) {

        alert("Escribe el origen y el destino.");

        return;

    }

    // MOSTRAR RELOJ

    reloj.style.display = "block";

    hora();

    // ABRIR GOOGLE MAPS EN TRANSPORTE PÚBLICO

    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&origin=" + encodeURIComponent(o) +
        "&destination=" + encodeURIComponent(d) +
        "&travelmode=transit";

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

};

</script>

</body>
</html>
